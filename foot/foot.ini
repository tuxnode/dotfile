shell=zsh
term=xterm-256color
title=foot
font=Input Mono Narrow:size=17
letter-spacing=0
dpi-aware=yes
pad=25x25
bold-text-in-bright=no
gamma-correct-blending=no

[scrollback]
lines=10000
multiplier=3

[cursor]
style=block
blink=yes

[mouse]
hide-when-typing=yes

[key-bindings]
scrollback-up-page=Page_Up
scrollback-up-half-page=Control+Page_Up
scrollback-up-line=none
scrollback-down-page=Page_Down
scrollback-down-half-page=Control+Page_Down
scrollback-down-line=none
search-start=Control+Shift+f
font-increase=Control+equal Control+plus
font-decrease=Control+minus
font-reset=Control+0
spawn-terminal=Control+Shift+n
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G

[colors]
alpha=1.0

foreground=f8f8f2
background=272822
selection-foreground=ffffff
selection-background=555555

regular0=272822
regular1=f92672
regular2=a6e22e
regular3=f4bf75
regular4=66d9ef
regular5=ae81ff
regular6=a1efe4
regular7=f8f8f2

bright0=75715e
bright1=f92672
bright2=a6e22e
bright3=f4bf75
bright4=66d9ef
bright5=ae81ff
bright6=a1efe4
bright7=f9f8f5
